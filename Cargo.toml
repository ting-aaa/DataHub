[workspace]
members = [
  "apps/datahub-api",
  "apps/datahub-cli",
  "apps/datahub-plugin-host",
  "apps/datahub-worker",
  "crates/datahub-auth",
  "crates/datahub-export",
  "crates/datahub-formula",
  "crates/datahub-kernel",
  "crates/datahub-persistence-pg",
  "crates/datahub-xlsx",
]
exclude = ["examples/datahub-echo-plugin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ting-aaa/DataHub"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
bson = { version = "3.1", features = ["serde"] }
calamine = "0.36"
csv = "1"
datahub-auth = { path = "crates/datahub-auth" }
datahub-export = { path = "crates/datahub-export" }
datahub-formula = { path = "crates/datahub-formula" }
datahub-kernel = { path = "crates/datahub-kernel" }
datahub-persistence-pg = { path = "crates/datahub-persistence-pg" }
datahub-xlsx = { path = "crates/datahub-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
num-traits = "0.2"
quick-xml = { version = "0.41", features = ["serialize"] }
rust_xlsxwriter = "0.99"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wit-component = "0.257"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
